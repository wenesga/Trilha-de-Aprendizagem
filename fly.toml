# fly.toml app configuration file generated for trilha-aprendizagem-wenes on 2026-09-20T11:47:21-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'trilha-aprendizagem-wenes'
primary_region = 'gru'

[build]
[env]
  TRILHA_DIR_DADOS = '/data'

[[mounts]]
  source = 'trilha_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/_stcore/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
